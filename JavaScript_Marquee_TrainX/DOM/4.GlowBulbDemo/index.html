<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb ON/OFF</title>
</head>
<body>

    <div id="box"
         style="width:400px;
                height:400px;
                border:2px solid black;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                margin:auto;
                margin-top:50px;">

        <!-- Bulb -->
        <div id="bulb"
             style="width:120px;
                    height:120px;
                    border-radius:50%;
                    background-color:white;
                    border:2px solid black;">
        </div>

        <div style="margin-top:30px;">
            <button id="onBtn">ON</button>
            <button id="offBtn">OFF</button>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
<!-- Create a bulb (circle) with 50% glow with ON/OFF feature, when we click On-> glows yellow light, and when we click off if comes to white color  -->
