<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <img src="https://i.pravatar.cc/200?img=5" alt="Profile" class="profile">

    <h2>Sophia Carter</h2>
    <p class="role">Web Developer</p>

    <div class="stats">
        <div>
            <h3>150</h3>
            <span>Posts</span>
        </div>

        <div>
            <h3>940K</h3>
            <span>Followers</span>
        </div>

        <div>
            <h3>100</h3>
            <span>Following</span>
        </div>
    </div>

    <div class="buttons">
        <button class="follow">Follow</button>
        <button class="message">Message</button>
    </div>

</div>

</body>
</html>
