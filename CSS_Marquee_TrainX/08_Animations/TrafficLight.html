<!DOCTYPE html>
<html>
<head>
    <title>Traffic Light</title>

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:black;
            padding:10px;
            border-radius:10px;
        }

        .light{
            width:80px;
            height:80px;
            border-radius:50%;
            margin:10px;
            background:gray;
        }

        .red{
            animation:red 6s infinite;
        }

        .yellow{
            animation:yellow 6s infinite;
        }

        .green{
            animation:green 6s infinite;
        }

        @keyframes red{
            0%,33%{background:red;}
            34%,100%{background:gray;}
        }

        @keyframes yellow{
            0%,33%,67%,100%{background:gray;}
            34%,66%{background:yellow;}
        }

        @keyframes green{
            0%,66%{background:gray;}
            67%,100%{background:green;}
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div>

</body>
</html>
