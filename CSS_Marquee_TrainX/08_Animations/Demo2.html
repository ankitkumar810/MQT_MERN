<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 100px;
            width: 400px;
            background-color: rgb(255, 0, 119);
            transition-property: all;
            transition-duration: 1s;
            transition-delay: 0s;
            <!-- border: 1px solid blue;  -->
            border-style: dashed; 
            border-radius: 20px;
            text-align: center;
        }
        #box:hover{
            background-color: yellow;
            width: 150px;
        }
    </style>
</head>
<body>
    <div id="box">Hover to see the transition</div>

</body>
</html>
