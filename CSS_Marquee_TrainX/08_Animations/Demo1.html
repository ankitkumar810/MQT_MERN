<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        #box {
            height: 100px;
            width: 100px;
            background-color: blue;
            border-radius: 10%;
            /* Transition Property */
            transition-property: all;
            transition-duration: 1s;
            transition-delay: 0s;
            border: 1px solid blue;
        }
        #box:hover{
            background-color: yellow;
            width: 150px;
        }
        button{
            color: blue;
            background-color:rgb(red, green, blue) ;
            outline:auto;
            border-radius: 10px;
            border: none;

            /* Transition */
            transition-property: all;
            transition-duration: 0.5s;
        }
        button:hover{
            background-color: rgb(red, green, blue);
            scale: 1.1;
        }
    </style>
</head>
<body>
    <div id="box"></div>
    <button>Click</button>
</body>
</html>
